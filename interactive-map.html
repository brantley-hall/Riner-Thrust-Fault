<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Geological Map - Fries Thrust Fault</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom Styles -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Source Serif 4', Georgia, serif;
            background: #0d0b08;
            color: #f5f0e8;
            line-height: 1.6;
        }
        
        .map-header {
            background: rgba(13, 11, 8, 0.92);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 2rem;
            text-align: center;
        }
        
        .map-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 900;
            color: #f5f0e8;
            margin-bottom: 0.5rem;
        }
        
        .map-subtitle {
            font-family: 'Inconsolata', monospace;
            font-size: 0.8rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #d4845a;
            margin-bottom: 1rem;
        }
        
        .map-container {
            position: relative;
            height: 600px;
            background: #1a1510;
            border: 2px solid #b05c2a;
            border-radius: 8px;
            overflow: hidden;
            margin: 2rem;
        }
        
        #geological-map {
            height: 100%;
            width: 100%;
        }
        
        .map-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            background: rgba(13, 11, 8, 0.9);
            border: 1px solid #b05c2a;
            border-radius: 8px;
            padding: 1rem;
            min-width: 200px;
        }
        
        .control-title {
            font-family: 'Inconsolata', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #d4845a;
            margin-bottom: 0.8rem;
            border-bottom: 1px solid #b05c2a;
            padding-bottom: 0.5rem;
        }
        
        .layer-toggle {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .layer-toggle:hover {
            color: #d4845a;
        }
        
        .layer-toggle input {
            margin-right: 0.5rem;
        }
        
        .layer-toggle label {
            font-family: 'Source Serif 4', serif;
            font-size: 0.9rem;
            cursor: pointer;
        }
        
        .info-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(13, 11, 8, 0.9);
            border: 1px solid #b05c2a;
            border-radius: 8px;
            padding: 1rem;
            max-width: 400px;
            z-index: 1000;
            transform: translateY(150%);
            transition: transform 0.3s ease;
        }
        
        .info-panel.active {
            transform: translateY(0);
        }
        
        .info-title {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: #f5f0e8;
            margin-bottom: 0.5rem;
        }
        
        .info-description {
            font-size: 0.9rem;
            color: #c9b99a;
            margin-bottom: 0.8rem;
        }
        
        .info-details {
            font-family: 'Inconsolata', monospace;
            font-size: 0.7rem;
            color: #8c7b6a;
        }
        
        .close-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #b05c2a;
            color: #f5f0e8;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .legend {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(13, 11, 8, 0.9);
            border: 1px solid #b05c2a;
            border-radius: 8px;
            padding: 1rem;
            z-index: 1000;
        }
        
        .legend-title {
            font-family: 'Inconsolata', monospace;
            font-size: 0.7rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #d4845a;
            margin-bottom: 0.8rem;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
        }
        
        .legend-color {
            width: 20px;
            height: 3px;
            margin-right: 0.5rem;
            border-radius: 2px;
        }
        
        .coordinates {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(13, 11, 8, 0.9);
            border: 1px solid #b05c2a;
            border-radius: 8px;
            padding: 0.8rem;
            z-index: 1000;
            font-family: 'Inconsolata', monospace;
            font-size: 0.7rem;
            color: #8c7b6a;
        }
        
        .scale-control {
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 1px solid #b05c2a;
        }
        
        .scale-slider {
            width: 100%;
            margin: 0.5rem 0;
        }
        
        @media (max-width: 768px) {
            .map-container {
                height: 400px;
                margin: 1rem;
            }
            
            .map-controls {
                top: 10px;
                right: 10px;
                min-width: 150px;
                padding: 0.8rem;
            }
            
            .info-panel {
                left: 10px;
                right: 10px;
                bottom: 10px;
            }
            
            .legend {
                display: none;
            }
        }
    </style>
</head>
<body>
    <header class="map-header">
        <h1 class="map-title">Interactive Geological Map</h1>
        <p class="map-subtitle">Fries Thrust Fault • Riner, Virginia</p>
    </header>

    <div class="map-container">
        <div id="geological-map"></div>
        
        <!-- Map Controls -->
        <div class="map-controls">
            <div class="control-title">Map Layers</div>
            
            <div class="layer-toggle">
                <input type="checkbox" id="fault-layer" checked>
                <label for="fault-layer">Thrust Fault</label>
            </div>
            
            <div class="layer-toggle">
                <input type="checkbox" id="property-layer" checked>
                <label for="property-layer">Property Boundary</label>
            </div>
            
            <div class="layer-toggle">
                <input type="checkbox" id="outcrops-layer" checked>
                <label for="outcrops-layer">Rock Outcrops</label>
            </div>
            
            <div class="layer-toggle">
                <input type="checkbox" id="geology-layer">
                <label for="geology-layer">Geological Units</label>
            </div>
            
            <div class="layer-toggle">
                <input type="checkbox" id="topography-layer">
                <label for="topography-layer">Topography</label>
            </div>
            
            <div class="scale-control">
                <label for="scale-slider">Detail Level</label>
                <input type="range" id="scale-slider" class="scale-slider" min="1" max="5" value="3">
                <div style="display: flex; justify-content: space-between; font-size: 0.6rem;">
                    <span>Low</span>
                    <span>High</span>
                </div>
            </div>
        </div>
        
        <!-- Coordinates Display -->
        <div class="coordinates">
            <div>Lat: <span id="lat-display">37.01</span></div>
            <div>Lng: <span id="lng-display">-80.51</span></div>
            <div>Zoom: <span id="zoom-display">13</span></div>
        </div>
        
        <!-- Information Panel -->
        <div class="info-panel" id="info-panel">
            <button class="close-info" onclick="closeInfoPanel()">×</button>
            <div class="info-title" id="info-title">Select a feature</div>
            <div class="info-description" id="info-description">Click on any map feature to see detailed geological information.</div>
            <div class="info-details" id="info-details"></div>
        </div>
        
        <!-- Legend -->
        <div class="legend">
            <div class="legend-title">Legend</div>
            
            <div class="legend-item">
                <div class="legend-color" style="background: #e74c3c;"></div>
                <span>Thrust Fault</span>
            </div>
            
            <div class="legend-item">
                <div class="legend-color" style="background: #3498db;"></div>
                <span>Property Boundary</span>
            </div>
            
            <div class="legend-item">
                <div class="legend-color" style="background: #f39c12;"></div>
                <span>Rock Outcrops</span>
            </div>
            
            <div class="legend-item">
                <div class="legend-color" style="background: #27ae60;"></div>
                <span>Metamorphic Rock</span>
            </div>
            
            <div class="legend-item">
                <div class="legend-color" style="background: #9b59b6;"></div>
                <span>Sedimentary Rock</span>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // Initialize the map
        const map = L.map('geological-map').setView([37.01, -80.51], 13);
        
        // Add tile layer
        const tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 18
        }).addTo(map);
        
        // Geological data
        const geologicalData = {
            fault: {
                coordinates: [
                    [37.03, -80.54],
                    [37.02, -80.52],
                    [37.01, -80.51],
                    [37.00, -80.50],
                    [36.99, -80.49],
                    [36.98, -80.48]
                ],
                style: {
                    color: '#e74c3c',
                    weight: 4,
                    opacity: 0.8,
                    dashArray: '10, 5'
                }
            },
            property: {
                bounds: [
                    [37.04, -80.55],
                    [36.97, -80.47]
                ],
                style: {
                    color: '#3498db',
                    weight: 2,
                    opacity: 0.5,
                    fillOpacity: 0.1
                }
            },
            outcrops: [
                {
                    coordinates: [37.01, -80.51],
                    name: "Outcrop A - Main Fault Exposure",
                    description: "Primary exposure of the Fries Thrust Fault with clear foliation and S-C fabric indicating top-to-the-southeast movement.",
                    rockType: "Gneiss",
                    age: "1.1-1.3 billion years",
                    observations: "Strong foliation, shear zones, mineral alignment"
                },
                {
                    coordinates: [37.00, -80.50],
                    name: "Outcrop B - Secondary Deformation",
                    description: "Secondary fault zone showing intense shearing and mylonitic texture development.",
                    rockType: "Mylonite",
                    age: "1.1-1.3 billion years",
                    observations: "Fine-grained matrix, rotated porphyroclasts, dynamic recrystallization"
                },
                {
                    coordinates: [36.99, -80.49],
                    name: "Outcrop C - Weathered Zone",
                    description: "Weathered fault zone margin showing advanced chemical weathering and soil development.",
                    rockType: "Weathered Gneiss",
                    age: "1.1-1.3 billion years",
                    observations: "Saprolite development, iron oxide staining, clay alteration"
                }
            ]
        };
        
        // Add layers
        const layers = {
            fault: L.polyline(geologicalData.fault.coordinates, geologicalData.fault.style).addTo(map),
            property: L.rectangle(geologicalData.property.bounds, geologicalData.property.style).addTo(map),
            outcrops: []
        };
        
        // Add outcrop markers
        geologicalData.outcrops.forEach(outcrop => {
            const marker = L.marker(outcrop.coordinates)
                .addTo(map)
                .bindPopup(`<strong>${outcrop.name}</strong><br>${outcrop.description}`);
            
            marker.on('click', () => showInfoPanel(outcrop));
            layers.outcrops.push(marker);
        });
        
        // Layer controls
        document.getElementById('fault-layer').addEventListener('change', (e) => {
            if (e.target.checked) {
                layers.fault.addTo(map);
            } else {
                map.removeLayer(layers.fault);
            }
        });
        
        document.getElementById('property-layer').addEventListener('change', (e) => {
            if (e.target.checked) {
                layers.property.addTo(map);
            } else {
                map.removeLayer(layers.property);
            }
        });
        
        document.getElementById('outcrops-layer').addEventListener('change', (e) => {
            if (e.target.checked) {
                layers.outcrops.forEach(marker => marker.addTo(map));
            } else {
                layers.outcrops.forEach(marker => map.removeLayer(marker));
            }
        });
        
        // Information panel functions
        function showInfoPanel(data) {
            const panel = document.getElementById('info-panel');
            document.getElementById('info-title').textContent = data.name;
            document.getElementById('info-description').textContent = data.description;
            document.getElementById('info-details').innerHTML = `
                <div><strong>Rock Type:</strong> ${data.rockType}</div>
                <div><strong>Age:</strong> ${data.age}</div>
                <div><strong>Observations:</strong> ${data.observations}</div>
            `;
            panel.classList.add('active');
        }
        
        function closeInfoPanel() {
            document.getElementById('info-panel').classList.remove('active');
        }
        
        // Update coordinates display
        map.on('mousemove', (e) => {
            document.getElementById('lat-display').textContent = e.latlng.lat.toFixed(4);
            document.getElementById('lng-display').textContent = e.latlng.lng.toFixed(4);
        });
        
        map.on('zoomend', () => {
            document.getElementById('zoom-display').textContent = map.getZoom();
        });
        
        // Scale slider functionality
        document.getElementById('scale-slider').addEventListener('input', (e) => {
            const scale = parseInt(e.target.value);
            const detailLevels = {
                1: { minZoom: 10, maxZoom: 12 },
                2: { minZoom: 11, maxZoom: 13 },
                3: { minZoom: 12, maxZoom: 14 },
                4: { minZoom: 13, maxZoom: 15 },
                5: { minZoom: 14, maxZoom: 16 }
            };
            
            // Adjust marker sizes based on scale
            layers.outcrops.forEach(marker => {
                const iconSize = 10 + (scale * 4);
                // Note: In a real implementation, you'd create custom icons
            });
        });
        
        // Add keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case '1':
                    document.getElementById('fault-layer').checked = !document.getElementById('fault-layer').checked;
                    document.getElementById('fault-layer').dispatchEvent(new Event('change'));
                    break;
                case '2':
                    document.getElementById('property-layer').checked = !document.getElementById('property-layer').checked;
                    document.getElementById('property-layer').dispatchEvent(new Event('change'));
                    break;
                case '3':
                    document.getElementById('outcrops-layer').checked = !document.getElementById('outcrops-layer').checked;
                    document.getElementById('outcrops-layer').dispatchEvent(new Event('change'));
                    break;
                case 'Escape':
                    closeInfoPanel();
                    break;
            }
        });
        
        // Add measurement tool (optional)
        let measurementMode = false;
        let measurementPoints = [];
        
        function toggleMeasurement() {
            measurementMode = !measurementMode;
            if (measurementMode) {
                map.getContainer().style.cursor = 'crosshair';
                map.on('click', addMeasurementPoint);
            } else {
                map.getContainer().style.cursor = '';
                map.off('click', addMeasurementPoint);
                clearMeasurements();
            }
        }
        
        function addMeasurementPoint(e) {
            if (!measurementMode) return;
            
            const point = L.marker(e.latlng, {
                icon: L.divIcon({
                    className: 'measurement-point',
                    html: '<div style="background: #f39c12; width: 8px; height: 8px; border-radius: 50%; border: 2px solid white;"></div>',
                    iconSize: [12, 12]
                })
            }).addTo(map);
            
            measurementPoints.push(point);
            
            if (measurementPoints.length === 2) {
                const distance = measurementPoints[0].getLatLng().distanceTo(measurementPoints[1].getLatLng());
                const line = L.polyline([
                    measurementPoints[0].getLatLng(),
                    measurementPoints[1].getLatLng()
                ], {
                    color: '#f39c12',
                    weight: 2,
                    dashArray: '5, 5'
                }).addTo(map);
                
                // Add distance label
                const midpoint = L.latLng(
                    (measurementPoints[0].getLatLng().lat + measurementPoints[1].getLatLng().lat) / 2,
                    (measurementPoints[0].getLatLng().lng + measurementPoints[1].getLatLng().lng) / 2
                );
                
                L.popup()
                    .setLatLng(midpoint)
                    .setContent(`Distance: ${(distance * 1000).toFixed(1)} meters`)
                    .openOn(map);
                
                // Reset measurement mode
                setTimeout(() => {
                    clearMeasurements();
                    measurementMode = false;
                    map.getContainer().style.cursor = '';
                    map.off('click', addMeasurementPoint);
                }, 2000);
            }
        }
        
        function clearMeasurements() {
            measurementPoints.forEach(point => map.removeLayer(point));
            measurementPoints = [];
        }
        
        // Initialize display
        document.getElementById('zoom-display').textContent = map.getZoom();
    </script>
</body>
</html>
